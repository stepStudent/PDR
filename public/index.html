<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Екзамен ПДР України — Офіційний теоретичний іспит</title>
  <meta name="description" content="Електронний фінальний іспит з Правил дорожнього руху України з офіційними питаннями, ілюстраціями та захищеною фіксацією результатів.">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .auth-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #2563eb, #0ea5e9, #10b981);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1.25rem;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
    }
    .auth-tabs {
      display: flex;
      background: var(--bg-elevated);
      border-radius: var(--radius-md);
      padding: 0.35rem;
      margin-bottom: 1.75rem;
      border: 1px solid var(--border);
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 0.65rem 0.5rem;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .auth-tab.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }
    .demo-accounts {
      margin-top: 2rem;
      padding: 1rem 1.25rem;
      background: rgba(30, 41, 59, 0.5);
      border: 1px dashed var(--border);
      border-radius: var(--radius-md);
      font-size: 0.8125rem;
      color: var(--text-muted);
    }
    .demo-accounts strong {
      color: #93c5fd;
    }
  </style>
  <script src="/js/theme.js"></script>
</head>
<body class="auth-page">

  <!-- Header -->
  <header class="navbar">
    <a href="/" class="brand" id="brand-link">
      <div class="brand-icon">🚦</div>
      <div>
        <div class="brand-title">ЕКЗАМЕН ПДР</div>
        <div class="brand-subtitle">Головний сервісний центр МВС</div>
      </div>
    </a>
    <div class="nav-actions">
      <!-- Theme Toggle Icon Button -->
      <button class="theme-toggle-btn" aria-label="Перемкнути тему" title="Перемкнути тему">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <span class="badge badge-locked">🔒 Захист протоколів SHA-256</span>
    </div>
  </header>

  <!-- Auth Content -->
  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">🚗</div>
        <h1>Екзамен ПДР України</h1>
        <p style="color: var(--text-muted); font-size: 0.9375rem; margin-top: 0.5rem;">
          Офіційний теоретичний іспит з правил дорожнього руху
        </p>
      </div>

      <!-- Auth Switch Tabs -->
      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" id="tab-user" type="button" onclick="switchAuthTab('user')">
          👤 Кандидат у водії
        </button>
        <button class="auth-tab" id="tab-admin" type="button" onclick="switchAuthTab('admin')">
          🛡️ Адміністратор
        </button>
      </div>

      <!-- Candidate Login Form -->
      <form id="form-user-login" onsubmit="handleUserLogin(event)">
        <div class="form-group">
          <label class="form-label" for="user-group">Навчальна група</label>
          <select id="user-group" class="form-control" required>
            <option value="">Оберіть вашу групу...</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="user-surname">Прізвище</label>
          <input type="text" id="user-surname" class="form-control" placeholder="Наприклад: Коваленко" required autocomplete="family-name">
        </div>

        <div class="form-group">
          <label class="form-label" for="user-password">Пароль екзаменованого</label>
          <div style="position: relative;">
            <input type="password" id="user-password" class="form-control" placeholder="Введіть виданий пароль" required autocomplete="current-password">
            <button type="button" onclick="togglePasswordVisibility('user-password', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" id="btn-user-submit" style="width: 100%; margin-top: 0.5rem;">
          Увійти та розпочати іспит →
        </button>
      </form>

      <!-- Admin Login Form -->
      <form id="form-admin-login" onsubmit="handleAdminLogin(event)" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="admin-username">Логін адміністратора</label>
          <input type="text" id="admin-username" class="form-control" value="admin" placeholder="admin" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="admin-password">Пароль адміністратора</label>
          <div style="position: relative;">
            <input type="password" id="admin-password" class="form-control" value="admin" placeholder="admin" required autocomplete="current-password">
            <button type="button" onclick="togglePasswordVisibility('admin-password', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" id="btn-admin-submit" style="width: 100%; margin-top: 0.5rem;">
          Увійти в панель адміністратора 🛡️
        </button>
      </form>

      <!-- Quick Demo Credentials Box -->
      <div class="demo-accounts">
        <div style="font-weight: 700; color: #fff; margin-bottom: 0.35rem;">💡 Тестові облікові записи:</div>
        <div>• <strong>Адміністратор:</strong> логін <code>admin</code>, пароль <code>admin</code></div>
        <div>• <strong>Кандидат:</strong> Група 24-А, прізвище <code>Коваленко</code>, пароль <code>pass123</code></div>
      </div>
    </div>
  </main>

  <!-- Toast Notification Center -->
  <div id="toast-container"></div>

  <script src="/js/auth.js"></script>
</body>
</html>
